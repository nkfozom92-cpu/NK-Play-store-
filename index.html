
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a73e8">
<title>NK Play Store Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f1f3f4;color:#202124;padding:15px}
.container{max-width:1000px;margin:auto;background:white;border-radius:20px;overflow:hidden;min-height:90vh}
header{padding:20px;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
header h2{color:#1a73e8}
main{padding:20px}
.card{padding:18px;border:1px solid #ddd;border-radius:15px;margin-bottom:15px}
input,textarea,select{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #ddd;border-radius:9px;font-size:15px}
button{padding:12px 18px;border:0;border-radius:9px;background:#1a73e8;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.secondary{background:#5f6368}
.danger{background:#d93025}
.hidden{display:none!important}
.nav{display:flex;gap:8px;overflow:auto;padding:12px;border-bottom:1px solid #eee}
.nav button{white-space:nowrap}
.app{border:1px solid #eee;padding:15px;border-radius:12px;margin:12px 0}
.app h3{margin-bottom:7px}
.tag{display:inline-block;background:#e8f0fe;color:#1a73e8;padding:5px 9px;border-radius:15px;font-size:12px;margin:7px 4px 7px 0}
#message{padding:10px;margin:10px 0;color:#137333}
</style>
</head>
<body>
<div class="container">
<header>
<h2><i class="fas fa-play-circle"></i> NK Play Store</h2>
<button id="logout" class="secondary hidden">Logout</button>
</header>

<main>
<div id="message"></div>

<section id="auth">
<div class="card">
<h2 id="authTitle">Admin Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<input id="name" class="hidden" placeholder="Full Name">
<button id="authBtn" style="width:100%">Sign In</button>
<p style="margin-top:15px;text-align:center">
<span id="switchText">No account?</span>
<a href="#" id="switch" style="color:#1a73e8">Create account</a>
</p>
</div>
</section>

<section id="dashboard" class="hidden">
<div class="nav">
<button data-tab="apps">All Apps</button>
<button data-tab="add" id="addTab">Add App</button>
<button data-tab="profile">Profile</button>
</div>

<section id="appsTab">
<h2>All Applications</h2>
<p id="count">Loading...</p>
<div id="appsList"></div>
</section>

<section id="addTabContent" class="hidden">
<div class="card">
<h2>Add New App</h2>
<label>App Name *</label>
<input id="appName" placeholder="App Name">
<label>Developer *</label>
<input id="developer" placeholder="Developer Name">
<label>Description</label>
<textarea id="description" placeholder="App Description"></textarea>
<label>Category</label>
<select id="category">
<option>Game</option><option>Education</option>
<option>Productivity</option><option>Social</option>
<option>Finance</option><option>Other</option>
</select>
<label>Status</label>
<select id="status">
<option>Approved</option><option>Pending</option><option>Draft</option>
</select>
<button id="save" style="width:100%">Save App</button>
</div>
</section>

<section id="profileTab" class="hidden">
<div class="card">
<h2>My Profile</h2>
<p id="profileEmail"></p>
<p id="profileRole"></p>
<p id="profileUid"></p>
</div>
</section>
</section>
</main>
</div>

<script type="module">
import {auth,db} from './firebase-config.js';
import {
createUserWithEmailAndPassword,signInWithEmailAndPassword,
signOut,onAuthStateChanged,updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
collection,addDoc,getDoc,doc,setDoc,query,orderBy,
onSnapshot,updateDoc,deleteDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const $=id=>document.getElementById(id);
let signup=false,user=null,role='user',unsubscribe=null,apps=[];

function msg(t){$('message').textContent=t}
function show(id){$(id).classList.remove('hidden')}
function hide(id){$(id).classList.add('hidden')}

$('switch').onclick=e=>{
e.preventDefault();
signup=!signup;
$('authTitle').textContent=signup?'Create Account':'Admin Login';
$('authBtn').textContent=signup?'Create Account':'Sign In';
$('switchText').textContent=signup?'Already have account?':'No account?';
$('switch').textContent=signup?'Sign In':'Create account';
$('name').classList.toggle('hidden',!signup);
};

$('authBtn').onclick=async()=>{
const email=$('email').value.trim();
const password=$('password').value;
if(!email||password.length<6)return msg('Valid email and 6+ character password required');
$('authBtn').disabled=true;
try{
if(signup){
const c=await createUserWithEmailAndPassword(auth,email,password);
const name=$('name').value.trim()||email.split('@')[0];
await updateProfile(c.user,{displayName:name});
await setDoc(doc(db,'users',c.user.uid),{
name,email,role:'user',createdAt:serverTimestamp()
});
msg('Account created');
}else{
await signInWithEmailAndPassword(auth,email,password);
msg('Login successful');
}
}catch(e){msg(e.message)}
finally{$('authBtn').disabled=false}
};

$('logout').onclick=async()=>{await signOut(auth)};

onAuthStateChanged(auth,async u=>{
if(unsubscribe){unsubscribe();unsubscribe=null}
user=u;
if(!u){
show('auth');hide('dashboard');hide('logout');return;
}
try{
const s=await getDoc(doc(db,'users',u.uid));
role=s.exists()?(s.data().role||'user'):'user';
if(!s.exists())await setDoc(doc(db,'users',u.uid),{
name:u.displayName||u.email,email:u.email,role:'user'
});
}catch(e){role='user';msg(e.message)}

hide('auth');show('dashboard');show('logout');
$('profileEmail').textContent=u.email;
$('profileRole').textContent='Role: '+role;
$('profileUid').textContent='UID: '+u.uid;
$('addTab').classList.toggle('hidden',role!=='admin');
loadApps();
});

function tab(t){
$('appsTab').classList.toggle('hidden',t!=='apps');
$('addTabContent').classList.toggle('hidden',t!=='add');
$('profileTab').classList.toggle('hidden',t!=='profile');
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
if(b.dataset.tab==='add'&&role!=='admin')return msg('Admin only');
tab(b.dataset.tab);
});

function loadApps(){
if(unsubscribe)unsubscribe();
unsubscribe=onSnapshot(
query(collection(db,'apps'),orderBy('createdAt','desc')),
snap=>{
apps=snap.docs.map(d=>({id:d.id,...d.data()}));
$('count').textContent=apps.length+' Apps';
$('appsList').innerHTML=apps.map(a=>`
<div class="app">
<h3>${escapeHTML(a.name)}</h3>
<p>${escapeHTML(a.developer)}</p>
<p>${escapeHTML(a.description||'')}</p>
<span class="tag">${escapeHTML(a.category)}</span>
<span class="tag">${escapeHTML(a.status)}</span>
${role==='admin'?`
<button onclick="editApp('${a.id}')">Edit</button>
<button class="danger" onclick="deleteApp('${a.id}')">Delete</button>`:''}
</div>`).join('')||'<p>No apps found</p>';
},e=>msg('Firestore: '+e.message)
);
}

function escapeHTML(v){
return String(v??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}

$('save').onclick=async()=>{
if(role!=='admin')return msg('Admin only');
const name=$('appName').value.trim();
const developer=$('developer').value.trim();
if(!name||!developer)return msg('Name and Developer required');
$('save').disabled=true;
try{
await addDoc(collection(db,'apps'),{
name,developer,description:$('description').value,
category:$('category').value,status:$('status').value,
createdBy:user.uid,createdAt:serverTimestamp()
});
msg('App saved successfully');
$('appName').value='';
$('developer').value='';
$('description').value='';
tab('apps');
}catch(e){msg(e.message)}
finally{$('save').disabled=false}
};

window.deleteApp=async id=>{
if(role!=='admin'||!confirm('Delete this app?'))return;
try{await deleteDoc(doc(db,'apps',id));msg('App deleted')}
catch(e){msg(e.message)}
};

window.editApp=async id=>{
if(role!=='admin')return;
const a=apps.find(x=>x.id===id);
if(!a)return;
const name=prompt('App Name',a.name);
if(name===null)return;
const developer=prompt('Developer',a.developer);
if(developer===null)return;
try{
await updateDoc(doc(db,'apps',id),{
name:name.trim(),developer:developer.trim(),updatedAt:serverTimestamp()
});
msg('App updated');
}catch(e){msg(e.message)}
};
</script>
</body>
</html>
